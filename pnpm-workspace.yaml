# The root project is the only workspace package. Older pnpm (< 10.5) rejects this file without `packages`.
packages:
  - .

# pnpm 11 no longer reads "pnpm.onlyBuiltDependencies" from package.json; this is its replacement.
# esbuild needs its install script to fetch the platform binary used by Vite.
allowBuilds:
  esbuild: true
